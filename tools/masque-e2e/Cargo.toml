[package]
name = "masque-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "End-to-end and benchmark client for masque-server development"
license = "MIT"
repository = "https://github.com/Vincent-bin/masque-server"
publish = false

[lints]
workspace = true

[[bin]]
name = "masque-e2e"
path = "src/main.rs"

[dependencies]
masque = { package = "masque-server", path = "../.." }
quiche = "0.29.3"
anyhow = "1"
base64 = "0.22.1"
boring = "4.3"
bytes = "1"
h2 = "0.4.18"
http = "1"
ring = "0.17"
tokio = { version = "1", features = ["full"] }
tokio-boring = "4.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
