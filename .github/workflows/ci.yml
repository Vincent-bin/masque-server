name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Clippy, and scripts
    # Pull requests get the complete source-level validation. A protected main
    # branch has already passed these checks on its tested merge commit, so its
    # push run only needs to exercise the release packaging path below.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal \
            --component clippy,rustfmt
          rustup default 1.97.1

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake shellcheck

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.97.1-native-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.97.1-native-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check shell scripts
        run: |
          sh -n install-latest.sh deploy/install.sh \
            tests/install-upgrade.sh tests/systemd-shutdown.sh
          shellcheck install-latest.sh deploy/install.sh scripts/*.sh \
            tests/*.sh tests/e2e/*.sh

  msrv:
    name: Check MSRV (1.88.0)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.88.0-native-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.88.0-native-

      - name: Check workspace
        run: cargo +1.88.0 check --workspace --locked

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install Linux native tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake openssl

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.97.1-native-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.97.1-native-

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Test systemd shutdown signals
        if: runner.os == 'Linux'
        run: MASQUE_TEST_BIN="$PWD/target/debug/masque-server" tests/systemd-shutdown.sh

      - name: Test installer upgrade safety
        if: runner.os == 'Linux'
        run: |
          sudo env \
            CI=true \
            MASQUE_INSTALLER_TEST=1 \
            MASQUE_TEST_PACKAGE_BIN="$PWD/target/debug/masque-server" \
            "$PWD/tests/install-upgrade.sh"

  release-build:
    name: Linux musl release build
    # Packaging is deliberately omitted from ordinary PR commits. It runs once
    # after merge and can still be exercised together with every other job via
    # workflow_dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake musl-tools

      - name: Install Rust target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add x86_64-unknown-linux-musl

      - name: Install Zig cross-linker
        run: |
          python3 -m pip install --user cargo-zigbuild==0.23.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.97.1-musl-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.97.1-musl-

      - name: Build archive
        env:
          TARGET: x86_64-unknown-linux-musl
          USE_ZIGBUILD: "1"
          VERSION: ci-${{ github.sha }}
        run: scripts/package-linux.sh

      - name: Inspect archive
        run: |
          tar tzf dist/masque-vci-${GITHUB_SHA}-linux-x86_64.tar.gz
          cd dist
          sha256sum --check \
            masque-vci-${GITHUB_SHA}-linux-x86_64.tar.gz.sha256
