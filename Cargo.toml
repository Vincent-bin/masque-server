[workspace]
members = [".", "tools/masque-e2e", "tools/masque-probe"]
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "masque-server"
version = "0.12.1"
edition = "2024"
rust-version = "1.88"
description = "High-performance MASQUE proxy for CONNECT, CONNECT-UDP, and CONNECT-IP over HTTP/2 and HTTP/3"
license = "MIT"
repository = "https://github.com/Vincent-bin/masque-server"
readme = "README.md"
keywords = ["masque", "http2", "http3", "quic", "proxy"]
categories = ["network-programming", "command-line-utilities"]
publish = false
default-run = "masque-server"

[lints]
workspace = true

[lib]
name = "masque"

[[bin]]
name = "masque-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
base64 = "0.22.1"
# Same BoringSSL binding quiche links against, so the two share one library.
# Needed to build the TLS context by hand: requesting a client certificate
# without verifying its chain has no equivalent in quiche's own Config API.
boring = "4.3"
# The safe wrapper does not expose per-connection session ID contexts. One
# narrowly wrapped call invalidates pre-reload tickets without disabling TLS
# resumption; foreign-types provides SslRef::as_ptr for that call.
boring-sys = "4.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
foreign-types = "0.5"
h2 = "0.4.18"
http = "1"
ipnet = "2"
quiche = "0.29.3"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-boring = "4.19"
toml = "0.8"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tun-rs = { version = "2", features = ["async_tokio"] }
zeroize = "1"

# Linux uses this for the packet path (recvmmsg, GSO/GRO, TUN offload); every
# Unix uses it to turn terminal echo off while `add-listener` reads a password
# and to keep an edited configuration file's owner.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bench]]
name = "core"
harness = false

# The packet path spans this crate and quiche, so cross-crate inlining is worth
# the longer build. `panic` is deliberately left at "unwind": the TCP and UDP
# relay tasks are spawned, so a panic in one tunnel is contained by Tokio today
# and would take down the whole proxy under "abort".
[profile.release]
lto = "fat"
codegen-units = 1
