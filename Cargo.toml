[workspace]
members = [".", "tests/e2e/masque-e2e"]
resolver = "3"

[package]
name = "masque"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
base64 = "0.22.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ipnet = "2"
quiche = "0.29.3"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2", features = ["async_tokio"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bench]]
name = "core"
harness = false
