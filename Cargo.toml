[workspace]
members = [".", "tools/masque-e2e"]
resolver = "3"

[package]
name = "masque-server"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "High-performance MASQUE proxy for CONNECT, CONNECT-UDP, and CONNECT-IP over HTTP/3"
license = "MIT"
repository = "https://github.com/Vincent-bin/masque-server"
readme = "README.md"
keywords = ["masque", "http3", "quic", "proxy", "vpn"]
categories = ["network-programming", "command-line-utilities"]
publish = false
default-run = "masque-server"

[lib]
name = "masque"

[[bin]]
name = "masque-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
base64 = "0.22.1"
# Same BoringSSL binding quiche links against, so the two share one library.
# Needed to build the TLS context by hand: requesting a client certificate
# without verifying its chain has no equivalent in quiche's own Config API.
boring = "4.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ipnet = "2"
quiche = "0.29.3"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2", features = ["async_tokio"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bench]]
name = "core"
harness = false

# The packet path spans this crate and quiche, so cross-crate inlining is worth
# the longer build. `panic` is deliberately left at "unwind": the TCP and UDP
# relay tasks are spawned, so a panic in one tunnel is contained by Tokio today
# and would take down the whole proxy under "abort".
[profile.release]
lto = "fat"
codegen-units = 1
