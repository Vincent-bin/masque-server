[package]
name = "quic-compare"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately separate from the production workspace and dependency graph.
[workspace]

[dependencies]
anyhow = "1"
# Match the production lockfile's quiche TLS implementation.
boring = "=4.22.0"
boring-sys = "=4.22.0"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
libc = "0.2"
quiche = "=0.30.0"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "fat"
codegen-units = 1
