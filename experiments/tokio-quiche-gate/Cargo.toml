[package]
name = "tokio-quiche-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

# P1 is isolated: a failed gate must not alter the production dependency graph.
[workspace]

[features]
# Requires the isolated, prepared upstream patch; never a production feature.
upstream-patch = []

[dependencies]
anyhow = "1"
boring = "=4.22.0"
boring-sys = "=4.22.0"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
quiche = "=0.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1.53.3", features = ["full"] }
tokio-quiche = { version = "=0.23.0", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
